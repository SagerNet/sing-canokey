name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name"
        required: true
        type: string
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calculate_version:
    name: Calculate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.outputs.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check input version
        if: github.event_name == 'workflow_dispatch'
        run: echo "version=${{ inputs.version }}" >> "$GITHUB_ENV"
      - name: Calculate version
        if: github.event_name != 'workflow_dispatch'
        run: echo "version=$(git describe --tags --always | sed 's/^v//')" >> "$GITHUB_ENV"
      - name: Set outputs
        id: outputs
        run: echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.os }}-${{ matrix.name || matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - calculate_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, zig_target: x86_64-linux-musl }
          - { os: linux, arch: '386', zig_target: x86-linux-musl }
          - { os: linux, arch: arm64, zig_target: aarch64-linux-musl }
          - { os: linux, arch: arm, goarm: '7', name: armv7, zig_target: arm-linux-musleabihf }
          - { os: linux, arch: riscv64, zig_target: riscv64-linux-musl }
          - { os: linux, arch: loong64, zig_target: loongarch64-linux-musl }
          - { os: linux, arch: mipsle, gomips: softfloat, zig_target: mipsel-linux-musleabi }
          - { os: linux, arch: mips64le, gomips64: softfloat, zig_target: mips64el-linux-muslabi64 }
          - { os: linux, arch: ppc64le, zig_target: powerpc64le-linux-musl }
          - { os: windows, arch: amd64, cc: x86_64-w64-mingw32-gcc }
          - { os: windows, arch: arm64, cc: aarch64-w64-mingw32-clang, llvm_mingw: '20250709' }
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup Zig
        if: matrix.zig_target != ''
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Zig wrappers
        if: matrix.zig_target != ''
        run: |
          mkdir -p "$HOME/zigcc"
          printf '#!/bin/sh\nexec zig cc -target %s -Wno-option-ignored "$@"\n' '${{ matrix.zig_target }}' > "$HOME/zigcc/cc"
          printf '#!/bin/sh\nexec zig ar "$@"\n' > "$HOME/zigcc/ar"
          printf '#!/bin/sh\nexec zig ranlib "$@"\n' > "$HOME/zigcc/ranlib"
          chmod +x "$HOME/zigcc/cc" "$HOME/zigcc/ar" "$HOME/zigcc/ranlib"
          ZIG_TARGET='${{ matrix.zig_target }}'
          echo "CC=$HOME/zigcc/cc" >> "$GITHUB_ENV"
          echo "CMAKE_FLAGS=-DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=${ZIG_TARGET%%-*} \
            -DCMAKE_C_COMPILER=$HOME/zigcc/cc -DCMAKE_AR=$HOME/zigcc/ar -DCMAKE_RANLIB=$HOME/zigcc/ranlib" >> "$GITHUB_ENV"
          echo "GO_LDFLAGS=-linkmode external -extldflags '-static -Wl,--strip-debug'" >> "$GITHUB_ENV"

      - name: Setup mingw-w64
        if: matrix.os == 'windows' && matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CMAKE_FLAGS=-DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DCMAKE_C_COMPILER=${{ matrix.cc }}" >> "$GITHUB_ENV"

      - name: Setup llvm-mingw
        if: matrix.llvm_mingw != ''
        run: |
          curl -sL "https://github.com/mstorsjo/llvm-mingw/releases/download/${{ matrix.llvm_mingw }}/llvm-mingw-${{ matrix.llvm_mingw }}-ucrt-ubuntu-22.04-x86_64.tar.xz" | tar -xJ -C "$HOME"
          echo "$HOME/llvm-mingw-${{ matrix.llvm_mingw }}-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CMAKE_FLAGS=-DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=${{ matrix.cc }}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: make lib_install

      - name: Build libraries
        run: make lib CMAKE_FLAGS="$CMAKE_FLAGS"

      - name: Build
        run: |
          mkdir -p dist
          BINARY=sing-canokey
          if [[ '${{ matrix.os }}' == 'windows' ]]; then
            BINARY=sing-canokey.exe
          fi
          go build -v -trimpath -ldflags "-s -w -buildid= $GO_LDFLAGS" -o "dist/$BINARY" ./cmd/sing-canokey
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips64 }}

      - name: Archive
        run: |
          cd dist
          DIR_NAME="sing-canokey-${{ needs.calculate_version.outputs.version }}-${{ matrix.os }}-${{ matrix.name || matrix.arch }}"
          mkdir -p "$DIR_NAME"
          cp ../LICENSE "$DIR_NAME"
          if [[ '${{ matrix.os }}' == 'windows' ]]; then
            cp sing-canokey.exe "$DIR_NAME"
            zip -r "$DIR_NAME.zip" "$DIR_NAME"
            rm sing-canokey.exe
          else
            cp sing-canokey "$DIR_NAME"
            tar -czf "$DIR_NAME.tar.gz" "$DIR_NAME"
            rm sing-canokey
          fi
          rm -r "$DIR_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.name || matrix.arch }}
          path: dist

  build_darwin:
    name: build (darwin-${{ matrix.arch }})
    runs-on: macos-latest
    timeout-minutes: 30
    needs:
      - calculate_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64 }
          - { arch: amd64, cmake_arch: x86_64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: make lib_install

      - name: Build libraries
        run: |
          if [[ -n '${{ matrix.cmake_arch }}' ]]; then
            make lib CMAKE_FLAGS="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }}"
          else
            make lib
          fi

      - name: Build
        run: |
          mkdir -p dist
          if [[ -n '${{ matrix.cmake_arch }}' ]]; then
            export CC="clang -arch ${{ matrix.cmake_arch }}"
          fi
          go build -v -trimpath -ldflags "-s -w -buildid=" -o dist/sing-canokey ./cmd/sing-canokey
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}

      - name: Archive
        run: |
          cd dist
          DIR_NAME="sing-canokey-${{ needs.calculate_version.outputs.version }}-darwin-${{ matrix.arch }}"
          mkdir -p "$DIR_NAME"
          cp ../LICENSE sing-canokey "$DIR_NAME"
          tar -czf "$DIR_NAME.tar.gz" "$DIR_NAME"
          rm -r "$DIR_NAME" sing-canokey

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-darwin-${{ matrix.arch }}
          path: dist

  upload:
    name: Upload builds
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    needs:
      - calculate_version
      - build
      - build_darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      - name: Cache ghr
        uses: actions/cache@v4
        id: cache-ghr
        with:
          path: ~/go/bin/ghr
          key: ghr

      - name: Setup ghr
        if: steps.cache-ghr.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/nekohasekai/ghr "$HOME/ghr"
          cd "$HOME/ghr"
          go install -v .

      - name: Set tag
        run: |
          git ls-remote --exit-code --tags origin "v${{ needs.calculate_version.outputs.version }}" || echo "PUBLISHED=false" >> "$GITHUB_ENV"
          git tag "v${{ needs.calculate_version.outputs.version }}" -f
          echo "VERSION=${{ needs.calculate_version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Download builds
        uses: actions/download-artifact@v5
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > "sing-canokey-${VERSION}.sha256sum"

      - name: Upload builds
        if: env.PUBLISHED == 'false'
        run: |
          export PATH="$PATH:$HOME/go/bin"
          ghr --replace --draft --prerelease -p 5 "v${VERSION}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace builds
        if: env.PUBLISHED != 'false'
        run: |
          export PATH="$PATH:$HOME/go/bin"
          ghr --replace -p 5 "v${VERSION}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
